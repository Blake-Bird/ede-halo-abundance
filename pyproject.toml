[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dmra"
version = "0.1.0"
description = "Independent halo mass function foundations and cosmological perturbation theory."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Blake Bird", email = "bbird1@highpoint.edu"}]
keywords = [
  "cosmology",
  "astrophysics",
  "dark-matter",
  "halo-mass-function",
  "early-dark-energy",
  "perturbation-theory",
  "numerical-methods",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/Blake-Bird/ede-halo-abundance"
Documentation = "https://github.com/Blake-Bird/ede-halo-abundance/blob/main/papers/ede_halo_abundance.pdf"
Repository = "https://github.com/Blake-Bird/ede-halo-abundance"
"Bug Tracker" = "https://github.com/Blake-Bird/ede-halo-abundance/issues"


[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.12",
  "mypy>=1.16",
]
validation = [
  "colossus>=1.3.9",
  "hmf>=3.5.2",
]
plots = [
  "matplotlib>=3.9",
]
data = ["pandas>=2.2", "pyarrow>=17"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dmra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
markers = [
  "external_solver: requires the pinned, locally built AxiCLASS and/or CLASS_EDE executables",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["external", "scratch", ".venv", "build", "dist"]


[tool.ruff.lint]
select = [
  "E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ARG", "PT", "PERF", "NPY"
]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
strict = true
packages = ["dmra"]
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
  "yaml.*",
  "yaml",
  "pandas.*",
  "pandas",
  "colossus.*",
  "colossus",
  "scipy.integrate.*",
]
ignore_missing_imports = true
